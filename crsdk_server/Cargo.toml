[package]
name = "crsdk_server"
version = "0.2.5"
edition = "2021"
description = "axum HTTP/SSE server exposing crsdk for browser/PWA clients"

[[bin]]
name = "crsdk_server"
path = "src/main.rs"

[dependencies]
crsdk      = { path = ".." }
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
tracing-subscriber = "0.3"
anyhow     = "1"
jpeg-decoder = "0.3"   # SW-AF: 라이브뷰 JPEG → 그레이스케일 선명도 측정
jpeg-encoder = "0.6"   # 스태킹/다중노출: 합성 결과 RGB → JPEG 인코드
