[package]
name = "crsdk_server"
version = "1.0.0"
edition = "2021"
description = "axum HTTP/SSE server exposing crsdk for browser/PWA clients"

[[bin]]
name = "crsdk_server"
path = "src/main.rs"

[dependencies]
crsdk      = { path = ".." }
axum       = "0.7"
tokio      = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = { version = "8", features = ["include-exclude"] }  # web/ UI를 exe에 임베드(단일 바이너리 배포 — web\ 폴더 불필요)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
tracing-subscriber = "0.3"
anyhow     = "1"
jpeg-decoder = "0.3"   # SW-AF: 라이브뷰 JPEG → 그레이스케일 선명도 측정
jpeg-encoder = "0.6"   # 스태킹/다중노출: 합성 결과 RGB → JPEG 인코드
stacker    = { path = "../stacker" }  # 라이브스택: 별 정렬 + 프레임 누적 엔진
detector   = { path = "../detector", optional = true }  # RT-DETR CoreML(추적AF, macOS 옵셔널)

[features]
# 기본 빌드엔 미포함(무거운 CoreML 모델/런타임). `--features detector`로 활성.
detector = ["dep:detector"]
# RAW 스택: ARW를 임베디드 JPEG 대신 rawler로 진짜 디코드(디모자이크+WB). `--features raw`.
raw = ["stacker/raw"]
