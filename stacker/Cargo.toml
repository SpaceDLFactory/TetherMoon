[package]
name = "stacker"
version = "1.0.0"
edition = "2021"
description = "Star-field alignment + frame stacking engine (live-view JPEG now, RAW behind --features raw later)"

[lib]
name = "stacker"
path = "src/lib.rs"

[dependencies]
# 순수 산술 엔진 — 기본 의존 없음.
# RAW 디코드는 `raw` feature에서만: rawler(dnglab)로 Sony ARW → bayer.
rawler = { version = "0.6", optional = true }

[features]
raw = ["dep:rawler"]
